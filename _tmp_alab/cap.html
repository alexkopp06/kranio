<!doctype html>
<html><head><meta charset="utf-8"><title>cap</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="v"></canvas>
<script src="alabastr.js"></script>
<script>
var q=new URLSearchParams(location.search);
var t=parseFloat(q.get('t')||'2.4');
var cr=(q.get('c')||'').split(',').map(Number);
var src=document.createElement('canvas');src.width=1200;src.height=675;
var g=src.getContext('2d');
var draw=window.__create();
draw(g,1200,675,t);
var v=document.getElementById('v'),vg=v.getContext('2d');
if(cr.length===4){
  v.width=1200;v.height=Math.round(1200*cr[3]/cr[2]);
  vg.imageSmoothingEnabled=true;
  vg.drawImage(src,cr[0],cr[1],cr[2],cr[3],0,0,v.width,v.height);
}else{
  v.width=1200;v.height=675;vg.drawImage(src,0,0);
}
document.title='done';
</script>
</body></html>
